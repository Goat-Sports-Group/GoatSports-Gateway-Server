# APPLICATION
spring.application.name=GOATSPORTS-GATEWAY-SERVER
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT}
spring.main.web-application-type=reactive
spring.http.codecs.max-in-memory-size=${HTTP_CODECS_MAX_IN_MEMORY_SIZE}
# SERVICES
user.service.url=${USER_SERVICE_URL}
venue.service.url=${VENUE_SERVICE_URL}
notification.service.url=${NOTIFICATION_SERVICE_URL}
report.service.url=${REPORT_SERVICE_URL}
# EUREKA
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
spring.cloud.discovery.enabled=${EUREKA_DISCOVERY_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL:}
eureka.instance.prefer-ip-address=${EUREKA_SERVICE_PREFER_IP_ADDRESS:false}
# SECURITY
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWT_SET_URI}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# Actuator
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
# Logging
logging.level.root=INFO
logging.level.me.minhdat=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
# JSON Format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
# REDIS
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
# RESILIENCE4J CIRCUIT BREAKER
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.venueServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.notificationServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.reportServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.configs.default.timeout-duration=6s
resilience4j.timelimiter.instances.userServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.venueServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.notificationServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.reportServiceCircuitBreaker.base-config=default