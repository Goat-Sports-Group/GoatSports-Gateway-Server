server.port=${SERVER_PORT}

spring.application.name=api-gateway
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}

spring.main.web-application-type=reactive
gateway.internal-secret=${GATEWAY_INTERNAL_SECRET}

# Route 1: Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URI}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/roles/**, /api/v1/permissions/**
spring.cloud.gateway.routes[0].filters[0]=AuthenticationHeaderFilter

# Route 2: Venue Service
spring.cloud.gateway.routes[1].id=venue-service
spring.cloud.gateway.routes[1].uri=${VENUE_SERVICE_URI}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/venues/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationHeaderFilter

# JWT Config
app.jwt.secret=${JWT_SECRET}